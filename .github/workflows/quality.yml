name: Calidad

on:
  pull_request:
  workflow_call:
    inputs:
      publish:
        description: Sube el sitio armado como artefacto de GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: npm test

      - name: Build site
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # La prueba de navegador corre sobre dist/: se valida lo mismo que se publica.
      - name: Browser smoke test
        env:
          SMOKE_SITE_ROOT: dist
        run: npm run smoke

      - name: Upload Pages artifact
        if: inputs.publish
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
