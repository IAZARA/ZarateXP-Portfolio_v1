name: Publicar sitio

# Sólo se publica lo que pasó las pruebas: el deploy depende del job de calidad.
on:
  push:
    branches: [main]
  # Los commits del bot de actividad usan GITHUB_TOKEN y no disparan "push".
  workflow_run:
    workflows: ['Actualizar actividad GitHub']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/quality.yml
    with:
      publish: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
