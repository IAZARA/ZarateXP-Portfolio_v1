<div class="explorer-container">
    <!-- Barra de menú -->
    <div class="explorer-menu-bar">
        <span class="menu-item">Archivo</span>
        <span class="menu-item">Edición</span>
        <span class="menu-item">Ver</span>
        <span class="menu-item">Favoritos</span>
        <span class="menu-item">Herramientas</span>
        <span class="menu-item">Ayuda</span>
    </div>

    <!-- Barra de herramientas -->
    <div class="explorer-toolbar">
        <div class="toolbar-group toolbar-navigation">
            <button class="toolbar-btn" id="btn-back" disabled title="Atrás">
                <img src="./assets/images/xp-small-icons/back.png" width="16" height="16" alt="Atrás"/>
                <span class="toolbar-label">Atrás</span>
            </button>
            <button class="toolbar-btn" id="btn-forward" disabled title="Adelante">
                <img src="./assets/images/xp-small-icons/forward.png" width="16" height="16" alt="Adelante"/>
            </button>
            <button class="toolbar-btn" id="btn-up" title="Arriba" disabled>
                <img src="./assets/images/xp-small-icons/up.png" width="16" height="16" alt="Arriba"/>
            </button>
        </div>
        <div class="toolbar-separator"></div>
        <div class="toolbar-group toolbar-search-actions">
            <button class="toolbar-btn" id="btn-search" title="Búsqueda">
                <img src="./assets/images/hd-icons/projects.svg" width="16" height="16" alt="Búsqueda"/>
                <span class="toolbar-label">Búsqueda</span>
            </button>
            <button class="toolbar-btn" id="btn-folders" title="Carpetas">
                <img src="./assets/images/hd-icons/documents.svg" width="16" height="16" alt="Carpetas"/>
                <span class="toolbar-label">Carpetas</span>
            </button>
        </div>
        <div class="toolbar-separator"></div>
        <div class="toolbar-group toolbar-view-actions">
            <div class="xp-view-picker" data-view-picker>
                <button class="toolbar-btn xp-view-trigger" id="btn-views" type="button" title="Cambiar vista" aria-haspopup="menu" aria-expanded="false" data-view-trigger>
                    <img src="./assets/images/xp-small-icons/detail-view.png" width="16" height="16" alt=""/>
                    <span>Vistas</span>
                    <span class="xp-view-caret" aria-hidden="true">▾</span>
                </button>
                <div class="xp-view-menu" role="menu" aria-label="Vistas" hidden data-view-menu>
                    <button type="button" role="menuitemradio" aria-checked="true" data-view-choice="icons">
                        <img src="./assets/images/hd-icons/projects.svg" width="16" height="16" alt=""><span>Iconos</span>
                    </button>
                    <button type="button" role="menuitemradio" aria-checked="false" data-view-choice="list">
                        <img src="./assets/images/xp-small-icons/detail-view.png" width="16" height="16" alt=""><span>Lista</span>
                    </button>
                    <button type="button" role="menuitemradio" aria-checked="false" data-view-choice="details">
                        <img src="./assets/images/xp-small-icons/detail-view.png" width="16" height="16" alt=""><span>Detalles</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Barra de direcciones -->
    <div class="explorer-address-bar">
        <label class="address-label">Dirección</label>
        <div class="address-input-container">
            <img src="./assets/images/hd-icons/documents.svg" width="16" height="16" alt="Carpeta" class="address-icon"/>
            <select id="project-location" class="address-input address-select" aria-label="Ubicación del proyecto">
                <option value="root">Mis Proyectos</option>
                <option value="featured">Mis Proyectos\Destacados FDE</option>
                <option value="web">Mis Proyectos\Desarrollo Web</option>
                <option value="ai">Mis Proyectos\IA y Automatización</option>
            </select>
        </div>
        <button class="address-go-btn" id="address-go" title="Ir">Ir</button>
    </div>

    <!-- Contenido principal -->
    <div class="explorer-main-content">
        <button class="explorer-panel-scrim" type="button" aria-label="Cerrar carpetas" hidden data-folders-scrim></button>
        <!-- Panel izquierdo: árbol de carpetas -->
        <div class="explorer-left-panel" id="folders-panel">
            <div class="panel-header">
                <img src="./assets/images/hd-icons/documents.svg" width="16" height="16" alt="Carpetas"/>
                Carpetas
            </div>
            <div class="folder-tree">
                <div class="tree-item expanded selected" data-folder="root" data-path="Mis Proyectos">
                    <div class="tree-item-content">
                        <span class="tree-expand">−</span>
                        <img src="./assets/images/hd-icons/documents.svg" width="16" height="16" class="tree-icon" alt="Carpeta"/>
                        <span class="tree-label">Mis Proyectos</span>
                    </div>
                    <div class="tree-children">
                        <div class="tree-item" data-folder="featured" data-path="Mis Proyectos\Destacados FDE">
                            <div class="tree-item-content">
                                <span class="tree-expand"></span>
                                <img src="./assets/images/hd-icons/cv.svg" width="16" height="16" class="tree-icon" alt="Carpeta"/>
                                <span class="tree-label">Destacados FDE</span>
                            </div>
                        </div>
                        <div class="tree-item" data-folder="web" data-path="Mis Proyectos\Desarrollo Web">
                            <div class="tree-item-content">
                                <span class="tree-expand">+</span>
                                <img src="./assets/images/hd-icons/documents.svg" width="16" height="16" class="tree-icon" alt="Carpeta"/>
                                <span class="tree-label">Desarrollo Web</span>
                            </div>
                        </div>
                        <div class="tree-item" data-folder="ai" data-path="Mis Proyectos\IA y Automatización">
                            <div class="tree-item-content">
                                <span class="tree-expand">+</span>
                                <img src="./assets/images/hd-icons/documents.svg" width="16" height="16" class="tree-icon" alt="Carpeta"/>
                                <span class="tree-label">IA y Automatización</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Separador redimensionable -->
        <div class="explorer-splitter" id="explorer-splitter"></div>

        <aside class="explorer-search-panel" id="search-panel" aria-label="Buscar proyectos" hidden>
            <div class="search-panel-title">Buscar proyectos</div>
            <label for="project-search-input">Nombre, tecnología o categoría</label>
            <input id="project-search-input" type="search" autocomplete="off" placeholder="Ej.: Java, IA, Oracle">
            <button type="button" id="project-search-clear">Limpiar búsqueda</button>
            <p id="project-search-help">La búsqueda revisa los 21 proyectos.</p>
        </aside>

        <!-- Panel derecho: contenido -->
        <div class="explorer-right-panel">
            <div id="explorer-content" class="content-area">
                <!-- Contenido dinámico según carpeta seleccionada -->
                <div class="loading-message">
                    <img src="./assets/images/hd-icons/projects.svg" width="32" height="32"/>
                    <p>Cargando proyectos...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Barra de estado -->
    <div class="explorer-status-bar">
        <div class="status-left">
            <span id="items-count">21 elementos</span>
        </div>
        <div class="status-right">
            <span id="selection-info">Mis Proyectos</span>
            <div class="status-separator"></div>
            <span id="folder-info">Carpeta</span>
        </div>
    </div>
</div>
