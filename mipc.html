<div class="window-body">
    <div class="mipc-menu-bar" role="menubar" aria-label="Menú de Mi PC">
        <span><u>A</u>rchivo</span>
        <span><u>E</u>dicion</span>
        <span><u>V</u>er</span>
        <span><u>F</u>avoritos</span>
        <span><u>H</u>erramientas</span>
        <span>A<u>y</u>uda</span>
    </div>

    <div class="mipc-function-bar" role="toolbar" aria-label="Navegación de Mi PC">
        <button type="button" data-mipc-action="back" disabled>
            <img src="assets/images/xp-small-icons/back.png" alt=""><span>Atrás</span>
        </button>
        <button type="button" class="mipc-icon-button" data-mipc-action="forward" aria-label="Adelante" disabled>
            <img src="assets/images/xp-small-icons/forward.png" alt="">
        </button>
        <button type="button" class="mipc-icon-button" data-mipc-action="up" aria-label="Arriba" disabled>
            <img src="assets/images/xp-small-icons/up.png" alt="">
        </button>
        <div class="separator" aria-hidden="true"></div>
        <button type="button" data-mipc-action="folders" aria-pressed="true">
            <img src="assets/images/xp-small-icons/folder-closed.png" alt=""><span>Carpetas</span>
        </button>
    </div>

    <div class="mipc-address-bar">
        <span>Dirección</span>
        <div class="address-input" aria-live="polite">
            <img src="assets/images/hd-icons/my-computer.svg" alt="Mi PC Icon" data-mipc-address-icon>
            <span data-mipc-address>Mi PC</span>
        </div>
    </div>

    <div class="mipc-main-content">
        <aside class="mipc-left-panel" aria-label="Tareas de Mi PC">
            <section class="panel-section">
                <h2 class="panel-header">Tareas del sistema</h2>
                <button type="button" class="mipc-task-link" data-mipc-program="system-properties">
                    <img src="assets/images/xp-small-icons/control-panel.png" alt=""><span>Ver información del sistema</span>
                </button>
                <button type="button" class="mipc-task-link" data-mipc-program="control-panel">
                    <img src="assets/images/xp-small-icons/control-panel.png" alt=""><span>Cambiar una configuración</span>
                </button>
                <button type="button" class="mipc-task-link" data-mipc-eject>
                    <img src="assets/images/xp-small-icons/removable-drive.png" alt=""><span>Expulsar este disco</span>
                </button>
            </section>

            <section class="panel-section">
                <h2 class="panel-header">Otros sitios</h2>
                <button type="button" class="mipc-task-link" data-mipc-path="computer">
                    <img src="assets/images/hd-icons/my-computer.svg" alt=""><span>Mi PC</span>
                </button>
                <button type="button" class="mipc-task-link" data-mipc-path="drive" data-mipc-drive-link>
                    <img src="assets/images/xp-small-icons/removable-drive.png" alt=""><span>Disco extraíble (F:)</span>
                </button>
            </section>

            <section class="panel-section mipc-details-section">
                <h2 class="panel-header">Detalles</h2>
                <p data-mipc-details>Mi PC muestra las unidades conectadas a este equipo.</p>
            </section>
        </aside>

        <main class="mipc-right-panel" data-mipc-content tabindex="-1" aria-label="Contenido de Mi PC"></main>
    </div>

    <div class="mipc-status-bar" role="status" aria-live="polite">
        <span data-mipc-status>1 objeto</span>
        <span>Mi PC</span>
    </div>
</div>
